<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css" />
  <title>Soukromý výklad – Virtuální kartářka</title>
  <meta name="description" content="Soukromá výsledková stránka tarotového výkladu." />
  <style>.result-wrap{padding:70px 0}.result-panel{max-width:960px;margin:auto;border:1px solid var(--line2);border-radius:30px;background:rgba(255,255,255,.055);box-shadow:var(--shadow);padding:34px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.reading-section{border-top:1px solid rgba(255,255,255,.1);padding:20px 0}.reading-section h2{font-size:28px;color:var(--gold2)}@media(max-width:760px){.result-grid{grid-template-columns:1fr}.result-panel{padding:24px 18px}}</style>
</head>
<body data-page="">
  <div data-site-header></div>
  <main class="site-main">

    <section class="result-wrap">
      <div class="container">
        <div class="result-panel" id="resultPanel">
          <div class="center"><span class="eyebrow">Soukromý výklad</span><h1 class="page-title">Výklad se otevírá…</h1><p class="lead">Načítám karty.</p></div>
        </div>
      </div>
    </section>

  </main>
  <div data-site-footer></div>
  <script src="/assets/site.js" defer></script>

<script>
(async()=>{const id=new URLSearchParams(location.search).get('id')||'demo';const panel=document.getElementById('resultPanel');try{const res=await fetch(`/vysledky/${encodeURIComponent(id)}.json`,{cache:'no-store'});if(!res.ok) throw new Error('missing');const d=await res.json();const cards=(d.cards||[]).map(c=>`<div class="result-card"><div class="pos">${c.position||''}</div><div class="sym">${c.symbol||'✦'}</div><strong>${c.name}</strong><small>${c.meaning||''}</small></div>`).join('');const sections=(d.sections||[]).map(s=>`<div class="reading-section"><h2>${s.title}</h2><p>${s.text}</p></div>`).join('');panel.innerHTML=`<div class="center"><span class="eyebrow">Výklad na 30 dní</span><h1 class="page-title">${d.title||'Tvůj výklad'}</h1><p class="lead">${d.intro||''}</p></div><div class="result-grid">${cards}</div>${sections}<div class="article-cta"><h2>Uzavírá se jeden měsíc?</h2><p class="muted">Až budeš chtít nový výhled, vrať se ke kartám s novou otázkou.</p><a class="btn btn-primary" href="/tarot.html">Nový výklad</a></div>`}catch(e){panel.innerHTML='<div class="center"><span class="eyebrow">Karty mlčí</span><h1 class="page-title">Výklad nebyl nalezen</h1><p class="lead">Zkontroluj odkaz v e-mailu, nebo napiš na info@tomys.cz.</p><div class="actions"><a class="btn btn-primary" href="/tarot.html">Zahájit nový výklad</a></div></div>'}})();
</script>

</body>
</html>
